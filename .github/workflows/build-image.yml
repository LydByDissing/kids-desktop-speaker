# GitHub Actions — Build Pi Image & Smoke Test
# =============================================
# Builds the Kids Desktop Speaker Pi OS image using Docker + QEMU user-mode
# emulation and runs smoke tests.
#
# Triggered on: push to main, pull requests

name: Build Pi Image

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE_NAME: kids-desktop-speaker
  IMAGE_TAG: latest

jobs:
  # -----------------------------------------------------------------------
  # Build, test, and bundle
  # -----------------------------------------------------------------------
  build-and-test:
    name: Build Image & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cross-compile services
        run: make cross-build
        working-directory: ci

      - name: Cache Raspbian base
        uses: actions/cache@v4
        with:
          path: ci/base/raspbian-bookworm-armhf.tar
          key: raspbian-base-${{ hashFiles('ci/base/build-base.sh', 'ci/base/raspbian.public.key') }}

      - name: Build image
        run: make build
        working-directory: ci

      - name: Run smoke tests
        run: make test
        working-directory: ci

      - name: Test on emulated Pi Zero W CPU
        run: make test-armv6
        working-directory: ci

      - name: Test bundle signing
        run: ci/scripts/test-signing.sh

      # The VM test is slow, so it runs on pushes to main, not on every PR.
      - name: Install VM test tools
        if: github.event_name == 'push'
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm genext2fs

      - name: Cache VM kernel
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: |
            ci/vm/vmlinuz
            ci/vm/initrd.img
          key: vm-kernel-${{ hashFiles('ci/vm/build-image.sh') }}

      - name: Boot VM and run API smoke tests
        if: github.event_name == 'push'
        run: make ci-test
        working-directory: ci
        env:
          FORCE_REBUILD: "1"
          KDS_VM_IMAGE: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          KDS_VM_BOOT_ATTEMPTS: "120"

      - name: Upload VM boot log
        if: failure() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: vm-boot-log
          path: /tmp/kds-vm.log
          if-no-files-found: ignore

      - name: Bundle image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: make -C ci bundle

      - name: Upload RAUC bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: rauc-bundle
          path: ci/output/image.raucb
          retention-days: 30
