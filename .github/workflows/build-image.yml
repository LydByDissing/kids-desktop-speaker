# GitHub Actions — Build Pi Image & Smoke Test
# =============================================
# Builds the Kids Desktop Speaker Pi OS image using Docker + QEMU user-mode
# emulation and runs smoke tests.
#
# Triggered on: push to main, pull requests

name: Build Pi Image

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE_NAME: kids-desktop-speaker
  IMAGE_TAG: latest

jobs:
  # -----------------------------------------------------------------------
  # Build, test, and bundle
  # -----------------------------------------------------------------------
  build-and-test:
    name: Build Image & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cross-compile services
        run: make cross-build
        working-directory: ci

      # librespot has no ARMv6 binaries, so it is built from its pinned crates.io
      # release (DEC-034). The output only changes with the build recipe.
      - name: Cache librespot
        uses: actions/cache@v4
        with:
          path: ci/librespot/out
          key: librespot-${{ hashFiles('ci/scripts/build-librespot.sh', 'ci/cross-alsa/Dockerfile', 'ci/cross-alsa/Cross.toml') }}

      - name: Build librespot
        run: make -C ci librespot

      # CamillaDSP (GPL-3.0) is built from its pinned release, and its source
      # published with each release (DEC-036).
      - name: Cache CamillaDSP
        uses: actions/cache@v4
        with:
          path: ci/camilladsp/out
          key: camilladsp-${{ hashFiles('ci/scripts/build-camilladsp.sh', 'ci/camilladsp/Cargo.lock', 'ci/cross-alsa/Dockerfile', 'ci/cross-alsa/Cross.toml') }}

      - name: Build CamillaDSP
        run: make -C ci camilladsp

      - name: Cache Raspbian base
        uses: actions/cache@v4
        with:
          path: ci/base/raspbian-bookworm-armhf.tar
          key: raspbian-base-${{ hashFiles('ci/base/build-base.sh', 'ci/base/raspbian.public.key') }}

      # Layer caching skips the slow emulated package installs. The scope changes
      # weekly so security updates still arrive. Releases build without it.
      - name: Expose GitHub cache to Docker
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Set weekly cache scope
        run: echo "CACHE_SCOPE=pi-image-$(date +%G-%V)" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Build image
        run: make build
        working-directory: ci
        env:
          BUILDX_CACHE: >-
            --cache-from type=gha,scope=${{ env.CACHE_SCOPE }}
            --cache-to type=gha,mode=max,scope=${{ env.CACHE_SCOPE }},ignore-error=true

      - name: Run smoke tests
        run: make test
        working-directory: ci

      - name: Test on emulated Pi Zero W CPU
        run: make test-armv6
        working-directory: ci

      - name: Test bundle signing
        run: ci/scripts/test-signing.sh

      # The VM test is slow, so it runs on pushes to main, not on every PR.
      - name: Install VM test tools
        if: github.event_name == 'push'
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm

      - name: Cache VM kernel
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: |
            ci/vm/vmlinuz
            ci/vm/initrd.img
            ci/vm/modules.tar
          key: vm-kernel-${{ hashFiles('ci/vm/build-image.sh') }}

      - name: Boot VM and run API smoke tests
        if: github.event_name == 'push'
        run: make ci-test
        working-directory: ci
        env:
          FORCE_REBUILD: "1"
          KDS_VM_IMAGE: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          KDS_VM_BOOT_ATTEMPTS: "120"

      - name: Upload VM boot log
        if: failure() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: vm-boot-log
          path: /tmp/kds-vm.log
          if-no-files-found: ignore

      - name: Test license inventory and SBOM
        if: github.event_name == 'push'
        run: |
          ci/scripts/test-license-inventory.sh
          make -C ci export-rootfs
          ci/scripts/gen-sbom.sh ci/output/rootfs.tar ci/output/sbom.spdx.json
          python3 ci/scripts/test_sbom.py ci/output/sbom.spdx.json ci/output/rootfs.tar

      # A/B update and rollback with U-Boot in QEMU (KDS-in5, DEC-028).
      - name: A/B update and rollback test in QEMU
        if: github.event_name == 'push'
        run: make -C ci vm-ab-test

      - name: Build and test SD card image
        if: github.event_name == 'push'
        run: make sd-image
        working-directory: ci

      - name: Bundle image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: make -C ci bundle

      - name: Upload RAUC bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: rauc-bundle
          path: ci/output/image.raucb
          retention-days: 30
