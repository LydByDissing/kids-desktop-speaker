# GitHub Actions — Build Pi Image & Smoke Test
# =============================================
# Builds the Kids Desktop Speaker Pi OS image using Docker + QEMU user-mode
# emulation and runs smoke tests.
#
# Triggered on: push to main, pull requests

name: Build Pi Image

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE_NAME: kids-desktop-speaker
  IMAGE_TAG: latest

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Build the Docker image
  # -----------------------------------------------------------------------
  build:
    name: Build Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: make build
        working-directory: ci

  # -----------------------------------------------------------------------
  # Job 2: Smoke tests
  # -----------------------------------------------------------------------
  test:
    name: Smoke Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: make build
        working-directory: ci

      - name: Run smoke tests
        run: make test
        working-directory: ci
