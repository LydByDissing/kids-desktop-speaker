name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

jobs:

  # ── Component builds (parallel) ──────────────────────────
  build-api-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-arm-${{ hashFiles('**/Cargo.lock') }}

      - run: cargo install cross --git https://github.com/cross-rs/cross

      - run: cross build --target arm-unknown-linux-gnueabihf --release -p api-server

      - uses: actions/upload-artifact@v4
        with:
          name: api-server-arm
          path: target/arm-unknown-linux-gnueabihf/release/api-server
          retention-days: 7

  build-audio-player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-arm-${{ hashFiles('**/Cargo.lock') }}

      - run: cargo install cross --git https://github.com/cross-rs/cross

      - run: cross build --target arm-unknown-linux-gnueabihf --release -p audio-player

      - uses: actions/upload-artifact@v4
        with:
          name: audio-player-arm
          path: target/arm-unknown-linux-gnueabihf/release/audio-player
          retention-days: 7

  build-ota-updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-arm-${{ hashFiles('**/Cargo.lock') }}

      - run: cargo install cross --git https://github.com/cross-rs/cross

      - run: cross build --target arm-unknown-linux-gnueabihf --release -p ota-updater

      - uses: actions/upload-artifact@v4
        with:
          name: ota-updater-arm
          path: target/arm-unknown-linux-gnueabihf/release/ota-updater
          retention-days: 7

  build-bluetooth-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-arm-${{ hashFiles('**/Cargo.lock') }}

      - run: cargo install cross --git https://github.com/cross-rs/cross

      - run: cross build --target arm-unknown-linux-gnueabihf --release -p bluetooth-service

      - uses: actions/upload-artifact@v4
        with:
          name: bluetooth-service-arm
          path: target/arm-unknown-linux-gnueabihf/release/bluetooth-service
          retention-days: 7

  build-wifi-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-arm-${{ hashFiles('**/Cargo.lock') }}

      - run: cargo install cross --git https://github.com/cross-rs/cross

      - run: cross build --target arm-unknown-linux-gnueabihf --release -p wifi-setup

      - uses: actions/upload-artifact@v4
        with:
          name: kds-wifi-setup-arm
          path: target/arm-unknown-linux-gnueabihf/release/kds-wifi-setup
          retention-days: 7

  # ── Image pipeline (sequential, depends on all above) ─────
  build-image:
    needs:
      - build-api-server
      - build-audio-player
      - build-ota-updater
      - build-bluetooth-service
      - build-wifi-setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: '*-arm'
          path: ci/binaries/
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x ci/binaries/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # librespot has no ARMv6 binaries, so it is built from its pinned crates.io
      # release (DEC-034). The output only changes with the build recipe.
      - name: Cache librespot
        uses: actions/cache@v4
        with:
          path: ci/librespot/out
          key: librespot-${{ hashFiles('ci/scripts/build-librespot.sh', 'ci/cross-alsa/Dockerfile', 'ci/cross-alsa/Cross.toml') }}

      - name: Build librespot
        run: make -C ci librespot

      # CamillaDSP (GPL-3.0) is built from its pinned release, and its source
      # published with each release (DEC-036).
      - name: Cache CamillaDSP
        uses: actions/cache@v4
        with:
          path: ci/camilladsp/out
          key: camilladsp-${{ hashFiles('ci/scripts/build-camilladsp.sh', 'ci/camilladsp/Cargo.lock', 'ci/camilladsp/patches/**', 'ci/cross-alsa/Dockerfile', 'ci/cross-alsa/Cross.toml') }}

      - name: Build CamillaDSP
        run: make -C ci camilladsp

      - name: Cache Raspbian base
        uses: actions/cache@v4
        with:
          path: ci/base/raspbian-bookworm-armhf.tar
          key: raspbian-base-${{ hashFiles('ci/base/build-base.sh', 'ci/base/raspbian.public.key') }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Build image
        run: make -C ci build BIN_DIR=ci/binaries VERSION=${{ github.ref_name }}

      - name: Run smoke tests
        run: make -C ci test

      - name: Test on emulated Pi Zero W CPU
        run: make -C ci test-armv6

      - name: Install VM test tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm

      - name: Cache VM kernel
        uses: actions/cache@v4
        with:
          path: |
            ci/vm/vmlinuz
            ci/vm/initrd.img
            ci/vm/modules.tar
          key: vm-kernel-${{ hashFiles('ci/vm/build-image.sh') }}

      - name: Boot VM and run API smoke tests
        run: make -C ci ci-test
        env:
          FORCE_REBUILD: "1"
          KDS_VM_IMAGE: kids-desktop-speaker:latest
          KDS_VM_BOOT_ATTEMPTS: "120"

      # A/B update and rollback with U-Boot in QEMU (KDS-in5, DEC-028).
      - name: A/B update and rollback test in QEMU
        run: make -C ci vm-ab-test

      - name: Build and verify signed RAUC bundle
        run: make -C ci bundle VERSION=${{ github.ref_name }}
        env:
          RAUC_SIGNING_KEY: ${{ secrets.RAUC_SIGNING_KEY }}
          RAUC_SIGNING_CERT: ${{ secrets.RAUC_SIGNING_CERT }}
          RAUC_REQUIRE_STABLE_KEY: "1"

      # Every package, its source version and license, for GPL and LGPL
      # obligations (KDS-khs).
      - name: Install Rust for the crate license list
        uses: dtolnay/rust-toolchain@stable

      # Collected in the same build as the binaries, while the exact source
      # versions are still in the archives (DEC-026).
      - name: Build license inventory, SBOM and GPL/LGPL source
        run: make -C ci legal-info VERSION=${{ github.ref_name }}

      - name: Upload RAUC bundle
        uses: actions/upload-artifact@v4
        with:
          name: rauc-bundle-staging
          path: |
            ci/output/image.raucb
            ci/output/legal-info/licenses.tar.gz
            ci/output/legal-info/sbom.spdx.json
            ci/output/legal-info/sources.tar
          retention-days: 7

  # ── Publish GitHub Release (only after the image job passes) ──
  publish-release:
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: write          # required to create a Release
    steps:
      - uses: actions/checkout@v4

      - name: Download staging bundle
        uses: actions/download-artifact@v4
        with:
          name: rauc-bundle-staging

      # The artifact keeps the legal files in legal-info/, below the bundle.
      - name: Check every release file is present
        run: ls -l image.raucb legal-info/licenses.tar.gz legal-info/sbom.spdx.json legal-info/sources.tar

      - name: Generate manifest
        run: ci/scripts/gen-manifest.sh image.raucb "${{ github.ref_name }}" > manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # Tags like v0.1.0-rc.1 are prereleases, which /releases/latest ignores,
          # so devices never install them automatically.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            image.raucb
            manifest.json
            legal-info/licenses.tar.gz
            legal-info/sbom.spdx.json
            legal-info/sources.tar
          # A missing file fails the release instead of being skipped silently,
          # as happened to v0.1.0-rc.3.
          fail_on_unmatched_files: true
