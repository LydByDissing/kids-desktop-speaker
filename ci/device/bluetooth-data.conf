# Pairings live on the data partition so they survive A/B updates (BT_REQ_003).
# bluetoothd's sandbox makes the filesystem read-only, so /data/bluetooth is
# bind-mounted over its state directory. "-" skips the mount when /data is
# missing (the VM), leaving the empty in-image directory.
[Unit]
After=kds-device-config.service

[Service]
BindPaths=-/data/bluetooth:/var/lib/bluetooth
