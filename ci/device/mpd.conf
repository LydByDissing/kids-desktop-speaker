# MPD plays internet radio for the Audio Player (RAD_REQ_001, DEC_005).
# audio-player controls it over the protocol on localhost; nothing else should.
bind_to_address "127.0.0.1"
port "6600"
user "mpd"
log_file "syslog"
# No music library or database: only stream URLs are played.
# No state file either, so the radio doesn't start by itself after a reboot
# (such as the nightly update reboot).

audio_output {
    type        "alsa"
    name        "speaker"
    # The shared output (DEC-033); it converts any rate for the HAT.
    device      "speaker"
    mixer_type  "software"
}
