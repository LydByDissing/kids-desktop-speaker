// AirPlay receiver for the kids desktop speaker (SW_REQ_002, DEC_004).
// audio-player starts shairport-sync with no arguments, so it reads this file.
// The package's own shairport-sync.service is disabled in the image.
general =
{
	// Advertise the device's hostname (kidsspeaker-xxxx), so several speakers
	// in one home stay distinguishable.
	name = "%H";
	// Simple sample stuffing for clock drift: soxr costs too much CPU on the
	// Pi Zero W.
	interpolation = "basic";
};

// Tell the Audio Player when AirPlay starts and stops playing, so only one
// source plays at a time (DEC-039).
sessioncontrol =
{
	run_this_before_play_begins = "/usr/local/bin/audio-player notify airplay active";
	run_this_after_play_ends = "/usr/local/bin/audio-player notify airplay inactive";
	wait_for_completion = "no";
};

alsa =
{
	// "speaker" (/etc/asound.conf) resamples to 48 kHz for the HAT, the same
	// path the announcements use. Measured: 16-18% CPU, about 0.2 s of buffer.
	output_device = "speaker";
};
