# BlueALSA receives audio only (DEC-035): the packaged service also offers
# a2dp-source, which confuses phones about which way audio flows.
# --a2dp-volume: native volume, so BlueALSA doesn't scale the audio by the
# phone's volume; the phone's AVRCP volume becomes the speaker's one volume
# instead (Bluetooth Service -> Audio Player, DEC-049).
[Service]
ExecStart=
ExecStart=/usr/bin/bluealsa -p a2dp-sink --a2dp-volume
