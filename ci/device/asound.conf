# ALSA output for the IQaudIO Pi-Codec Zero (KDS-ayx, DEC-033).
#
# hat_mix shares the HAT between programs: a paused source (shairport-sync
# stopped with SIGSTOP during an announcement) keeps its PCM open, and the
# chimes and speech still play. The codec rejects rates such as 22.05 kHz
# instead of converting them, so dmix runs at 48 kHz and "speaker" converts
# everything to it. "speaker" is the default device.
pcm.hat_mix {
    type dmix
    ipc_key 4242
    ipc_perm 0666
    slave {
        pcm "hw:IQaudIOCODEC,0"
        rate 48000
        format S16_LE
        channels 2
        period_size 1024
        buffer_size 8192
    }
}
pcm.speaker {
    type plug
    slave.pcm "hat_mix"
}
pcm.!default speaker
ctl.!default {
    type hw
    card IQaudIOCODEC
}
