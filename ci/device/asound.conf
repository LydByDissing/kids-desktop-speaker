# ALSA output for the IQaudIO Pi-Codec Zero (KDS-ayx).
# The codec rejects rates such as 22.05 kHz instead of converting them, so
# "speaker" resamples everything to 48 kHz. It is also the default device.
pcm.speaker {
    type plug
    slave {
        pcm "hw:IQaudIOCODEC,0"
        rate 48000
    }
}
pcm.!default speaker
ctl.!default {
    type hw
    card IQaudIOCODEC
}
