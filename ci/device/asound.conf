# ALSA output for the IQaudIO Pi-Codec Zero (KDS-ayx, DEC-033, DEC-036).
#
# Every source and the announcer write to "speaker". hat_mix is a dmix, so they
# can share the output: a paused source (stopped with SIGSTOP during an
# announcement) keeps its PCM open and the chimes and speech still play. dmix
# runs at 48 kHz and "speaker" converts every rate to it. The dmix writes into
# an ALSA loopback; CamillaDSP reads the other end, processes it and plays it on
# the HAT (/etc/camilladsp/config.yml). "speaker" is the default device.
pcm.hat_mix {
    type dmix
    ipc_key 4242
    ipc_perm 0666
    slave {
        pcm "hw:Loopback,0,0"
        rate 48000
        format S16_LE
        channels 2
        period_size 1024
        buffer_size 8192
    }
}
pcm.speaker {
    type plug
    slave.pcm "hat_mix"
}
pcm.!default speaker
ctl.!default {
    type hw
    card IQaudIOCODEC
}
