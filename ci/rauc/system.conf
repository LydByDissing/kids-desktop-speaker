# RAUC system configuration — Kids Desktop Speaker
# ==================================================
# A/B root slots on the SD card, selected by U-Boot (DEC-025). The boot and data
# partitions are never updated by RAUC, so they are not slots.

[system]
compatible=kids-desktop-speaker
bootloader=uboot
max-bundle-download-size=536870912

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B
