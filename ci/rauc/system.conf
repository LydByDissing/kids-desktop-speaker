# RAUC system configuration — Kids Desktop Speaker
# ==================================================
# A/B root slots, selected by U-Boot (DEC-025). Partitions are found by UUID, so
# the same file works on the Pi and in the VM (DEC-028). The boot and data
# partitions are never updated by RAUC, so they are not slots.

[system]
compatible=kids-desktop-speaker
bootloader=uboot
max-bundle-download-size=536870912

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/disk/by-partuuid/4b445300-02
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partuuid/4b445300-03
type=ext4
bootname=B
