# RAUC system configuration — Kids Desktop Speaker
# ==================================================
# Defines the A/B partition layout for atomic OTA updates.
#
# In production, boot/rootfs-a/rootfs-b are real partitions on the SD card.
# In CI, we use loopback devices to simulate the layout for bundle creation.

[system]
compatible=kids-desktop-speaker
bootloader=uboot
max-bundle-download-size=83886080

[slot.boot.0]
device=/dev/mmcblk0p1
type=vfat
bootname=boot
readonly=false

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A
readonly=false

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B
readonly=false

[slot.data.0]
device=/dev/mmcblk0p4
type=ext4
bootname=data
readonly=false
