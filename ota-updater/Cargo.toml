[package]
name = "ota-updater"
version = "0.1.0"
edition = "2021"

[lib]
name = "ota_updater"
path = "src/lib.rs"

[[bin]]
name = "ota-updater"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
