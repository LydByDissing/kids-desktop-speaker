[package]
name = "ota-updater"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "ota_updater"
path = "src/lib.rs"

[[bin]]
name = "ota-updater"
path = "src/main.rs"

[dependencies]
kds-ipc = { path = "../kds-ipc" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
sha2 = "0.10"
hex = "0.4"
semver = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
wiremock = "0.6"
