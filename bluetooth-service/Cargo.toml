[package]
name = "bluetooth-service"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "bluetooth-service"
path = "src/main.rs"

[dependencies]
kds-ipc = { path = "../kds-ipc" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
