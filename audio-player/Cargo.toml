[package]
name = "audio-player"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "audio_player"
path = "src/lib.rs"

[[bin]]
name = "audio-player"
path = "src/main.rs"

[dependencies]
kds-ipc = { path = "../kds-ipc" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
nix = { version = "0.27", features = ["signal"] }
