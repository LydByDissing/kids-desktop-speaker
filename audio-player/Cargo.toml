[package]
name = "audio-player"
version = "0.1.0"
edition = "2021"

[lib]
name = "audio_player"
path = "src/lib.rs"

[[bin]]
name = "audio-player"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
nix = { version = "0.27", features = ["signal"] }
