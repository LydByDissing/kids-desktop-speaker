[package]
name = "audio-player"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "audio_player"
path = "src/lib.rs"

[[bin]]
name = "audio-player"
path = "src/main.rs"

[dependencies]
kds-ipc = { path = "../kds-ipc" }
tts-engine = { path = "../tts-engine" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
nix = { version = "0.27", features = ["signal"] }
# Podcast feeds (POD_REQ_001): rustls with ring like the OTA Updater, and a
# small XML parser.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
roxmltree = "0.20"
# The radio and podcast player (DEC-048): pure-Rust decoders, no FFmpeg.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "ogg", "vorbis", "flac", "wav", "pcm"] }
bytes = "1"
# CamillaDSP's websocket, for the device volume (DEC-040).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[dev-dependencies]
tokio-tungstenite = "0.30"
